name: Schematron Validation (MEI DC)

on:
  push:
    # Run on pushes to main or develop branches
    branches: 
      - main
      - develop
  pull_request:
    # Run on PRs targeting main or develop branches
    branches: 
      - main
      - develop

jobs:
  validate-schematron:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Report Directory
        run: |
          mkdir -p .github/workflow-reports

      - name: Find all XML files
        id: find-xml
        run: |
          # Find all .xml files, excluding common ignored paths
          find . -type f -name "*.xml" \
            ! -path "./.github/*" \
            ! -path "./vendor/*" \
            ! -path "./.git/*" \
            ! -name "*.xml.bak" \
            > xml_files.txt
          
          count=$(wc -l < xml_files.txt)
          echo "Found $count XML files."
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Run Schematron Validation (via Docker)
        id: validation
        env:
          # The specific path to your Schematron file
          SCHEMATRON_FILE: "mei-metadata-toolkit/src/schema/mei-dc.sch"
          # The specific path for the output report
          REPORT_FILE: ".github/workflow-reports/mei-dc-validation_report.txt"
        run: |
          REPORT="$REPORT_FILE"

          # Pull Saxn-HE-12.4
          docker pull saxonica/saxon-he:12.4
          
          # Initialize the report
          echo "### Schematron Validation Report" > "$REPORT"
          echo "Branch: ${{ github.ref_name }}" >> "$REPORT"
          echo "Schema: $SCHEMATRON_FILE" >> "$REPORT"
          echo "" >> "$REPORT"
          
          ALL_SUCCESS=true
          
          # Read the list of files and validate each one using the Saxon Docker container
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            
            echo "Validating: $file" >> "$REPORT"
            
            # Run Saxon via Docker
            # Mounts the current workspace to /work inside the container
            # -s: source file, -schematron: the schema file
            output=$(docker run --rm -v "${{ github.workspace }}:/work" saxonica/saxon-he:12.4 \
              -s=/work/$file \
              -schematron=/work/$SCHEMATRON_FILE 2>&1)
            
            exit_code=$?
            
            if [ $exit_code -eq 0 ]; then
              echo "  ✅ Status: PASSED" >> "$REPORT"
              echo "" >> "$REPORT"
            else
              ALL_SUCCESS=false
              echo "  ❌ Status: FAILED" >> "$REPORT"
              echo "  --- Error Messages ---" >> "$REPORT"
              echo "$output" >> "$REPORT"
              echo "" >> "$REPORT"
            fi
          done < xml_files.txt

          # Final Summary
          echo "### Summary" >> "$REPORT"
          if [ "$ALL_SUCCESS" = true ]; then
            echo "✅ All XML files validated successfully against $SCHEMATRON_FILE." >> "$REPORT"
          else
            echo "❌ One or more XML files failed validation." >> "$REPORT"
          fi

          # Output the report content to the logs for visibility in the Action summary
          echo "## Validation Report"
          cat "$REPORT"

      - name: Fail if Validation Failed
        run: |
          if grep -q "❌ One or more XML files failed validation" "$REPORT_FILE"; then
            echo "Validation failed. Check the report above and in the Artifacts."
            exit 1
          fi
          echo "Validation passed."
          exit 0

      - name: Upload Validation Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mei-dc-validation-report
          path: .github/workflow-reports/mei-dc-validation_report.txt
