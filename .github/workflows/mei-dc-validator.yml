name: XML File Discovery and Schematron Validation

on:
  push:
    branches:
      - ftr/metadata-validation-and-generation
      - main
  pull_request:
    branches:
      - ftr/metadata-validation-and-generation
      - main
  workflow_dispatch:

# Required to allow the workflow to push changes back to the repo
permissions:
  contents: write

jobs:
  generate-xml-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Schematron Validation Tool
        run: |
          # Install the specific pyschematron tool requested
          pip install pyschematron

      - name: Find XML files and Generate Validation Report
        run: |
          # 1. Create the output directory
          mkdir -p .github/workflow-reports

          # 2. Find all .xml files
          find . -type f -name "*.xml" | sort > /tmp/xml_files.txt

          # 3. Initialize the report header
          REPORT_FILE=".github/workflow-reports/mei-dc-validation_report.md"
          
          cat > "$REPORT_FILE" << 'EOF'
# MEI-DC XML Validation Report

## Summary
The following XML files were scanned against the Schematron rules.

| File Path | Size (bytes) | Validation Status | Details |
| :--- | :--- | :--- | :--- |
EOF

          # 4. Iterate through files
          TOTAL_FILES=0
          VALID_COUNT=0
          INVALID_COUNT=0

          while IFS= read -r file; do
            TOTAL_FILES=$((TOTAL_FILES + 1))
            size=$(stat -c%s "$file" 2>/dev/null || echo "0")
            
            # Run Schematron validation
            # pyschematron returns 0 on success, non-zero on failure
            # We capture stderr to get the error message
            output=$(pyschematron -s "mei-metadata-toolkit/src/schema/mei-dc.sch" "$file" 2>&1)
            exit_code=$?

            if [ $exit_code -eq 0 ]; then
              status="✅ Pass"
              details="No errors found."
              VALID_COUNT=$((VALID_COUNT + 1))
            else
              status="❌ Fail"
              # Clean up the output to fit in the markdown table (remove newlines)
              details=$(echo "$output" | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-100)
              if [ ${#details} -eq 0 ]; then
                details="Validation failed (no specific message)."
              fi
              INVALID_COUNT=$((INVALID_COUNT + 1))
            fi

            # Append row to report
            echo "| $file | $size | $status | $details |" >> "$REPORT_FILE"
            
          done < /tmp/xml_files.txt

          # 5. Append Summary Footer
          {
            echo ""
            echo "## Summary Statistics"
            echo ""
            echo "- **Total Files Scanned:** $TOTAL_FILES"
            echo "- **Passed:** $VALID_COUNT"
            echo "- **Failed:** $INVALID_COUNT"
            echo ""
            if [ $INVALID_COUNT -gt 0 ]; then
              echo "> ⚠️ **Warning:** $INVALID_COUNT file(s) failed validation. Please check the details above."
            else
              echo "> ✅ **Success:** All files passed validation."
            fi
          } >> "$REPORT_FILE"

      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xml-validation-report
          path: .github/workflow-reports/mei-dc-validation_report.md

      - name: Commit and Push Report
        # This step will only run if the workflow is not a Pull Request from a fork
        # or if you have configured specific permissions for forks.
        # For standard internal branches, this works out of the box.
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add the report file
          git add .github/workflow-reports/mei-dc-validation_report.md
          
          # Commit only if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update XML validation report with Schematron results"
            git push
            echo "Report pushed to repository."
          fi