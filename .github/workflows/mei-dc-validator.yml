name: Schematron Validation (MEI DC)

on:
  push:
    branches: 
      - main
      - develop
  pull_request:
    branches: 
      - main
      - develop

jobs:
  validate-schematron:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Report Directory
        run: |
          mkdir -p .github/workflow-reports

      - name: Install Java and Saxon-HE
        run: |
          # 1. Install Java Runtime (required to run the Saxon JAR)
          sudo apt-get update
          sudo apt-get install -y default-jre-headless

          # 2. Download Saxon-HE from the official GitHub Releases
          wget -q https://github.com/Saxonica/Saxon-HE/releases/download/SaxonHE12-9/SaxonHE12-9J.zip
          
          # 3. Unzip the archive
          unzip -q SaxonHE12-9J.zip
          
          # 4. Set the path to the JAR file in the environment
          # The directory created is usually named "SaxonHE12-9"
          echo "SAXON_JAR=$(pwd)/SaxonHE12-9/SaxonHE12-9J.jar" >> $GITHUB_ENV

      - name: Find all XML files
        id: find-xml
        run: |
          find . -type f -name "*.xml" \
            ! -path "./.github/*" \
            ! -path "./vendor/*" \
            ! -path "./.git/*" \
            ! -name "*.xml.bak" \
            > xml_files.txt
          
          count=$(wc -l < xml_files.txt)
          echo "Found $count XML files."
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Run Schematron Validation
        id: validation
        env:
          # Your specific Schematron file path
          SCHEMATRON_FILE: "mei-metadata-toolkit/src/schema/mei-dc.sch"
          # Your specific Report file path
          REPORT_FILE: ".github/workflow-reports/mei-dc-validation_report.txt"
        run: |
          REPORT="$REPORT_FILE"
          
          # Initialize the report
          echo "### Schematron Validation Report" > "$REPORT"
          echo "Branch: ${{ github.ref_name }}" >> "$REPORT"
          echo "Schema: $SCHEMATRON_FILE" >> "$REPORT"
          echo "" >> "$REPORT"
          
          ALL_SUCCESS=true
          
          # Iterate through every XML file found
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            
            echo "Validating: $file" >> "$REPORT"
            
            # Run Saxon-HE
            # -s: Source XML file
            # -schematron: The Schematron schema file
            # 2>&1: Capture both stdout and stderr
            output=$(java -jar "$SAXON_JAR" -s="$file" -schematron="$SCHEMATRON_FILE" 2>&1)
            exit_code=$?
            
            if [ $exit_code -eq 0 ]; then
              echo "  ✅ Status: PASSED" >> "$REPORT"
              echo "" >> "$REPORT"
            else
              ALL_SUCCESS=false
              echo "  ❌ Status: FAILED" >> "$REPORT"
              echo "  --- Error Messages ---" >> "$REPORT"
              echo "$output" >> "$REPORT"
              echo "" >> "$REPORT"
            fi
          done < xml_files.txt

          # Final Summary
          echo "### Summary" >> "$REPORT"
          if [ "$ALL_SUCCESS" = true ]; then
            echo "✅ All XML files validated successfully." >> "$REPORT"
          else
            echo "❌ One or more XML files failed validation." >> "$REPORT"
          fi

          # Print the report to the Action logs
          echo "## Validation Report"
          cat "$REPORT"

      - name: Fail if Validation Failed
        run: |
          if grep -q "❌ One or more XML files failed validation" "$REPORT_FILE"; then
            echo "Validation failed. Check the report above."
            exit 1
          fi
          echo "Validation passed."
          exit 0

      - name: Upload Validation Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mei-dc-validation-report
          path: .github/workflow-reports/mei-dc-validation_report.txt
