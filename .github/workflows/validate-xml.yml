name: XML File Discovery and Report

on:
  # Trigger on push to main or any branch, or manually
  push:
    branches: 
      - ftr/metadata-validation-and-generation
      - main
  pull_request:
    branches: 
      - ftr/metadata-validation-and-generation
      - main
  workflow_dispatch:

jobs:
  generate-xml-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find all .xml files and generate report
        run: |
          # 1. Create the output directory if it doesn't exist
          mkdir -p .github/workflow-reports

          # 2. Find all .xml files and write to a temporary list
          # We use 'find' to get files, then 'sort' to make the list consistent
          find . -type f -name "*.xml" | sort > /tmp/xml_files.txt

          # 3. Check if any files were found
          if [ -s /tmp/xml_files.txt ]; then
            # 4. Generate the Markdown report
            {
              echo "# MEI-DC XML Validation Report"
              echo ""
              echo "The following XML files were found in the repository:"
              echo ""
              echo "| File Path | Size (bytes) |"
              echo "| :--- | :--- |"
              
              # Iterate through the list to add file size for extra context
              while IFS= read -r file; do
                # Get file size
                size=$(stat -c%s "$file" 2>/dev/null || echo "0")
                echo "| $file | $size |"
              done < /tmp/xml_files.txt

              echo ""
              echo "Total files found: $(wc -l < /tmp/xml_files.txt)"
            } > .github/workflow-reports/list-xml-files.md
          else
            # 5. Handle case where no files are found
            {
              echo "# MEI-DC XML Validation Report"
              echo ""
              echo "No `.xml` files were found in the repository."
            } > .github/workflow-reports/list-xml-files.md
          fi

      - name: Upload Report as Artifact (Optional)
        uses: actions/upload-artifact@v7
        with:
          name: xml-report
          path: .github/workflow-reports/list-xml-files.md

      - name: Commit and Push Report (Optional)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/workflow-reports/list-xml-files.md
          git commit -m "Update XML validation report" || echo "No changes to commit"
          git push
          # Note: The 'git push' step will fail in Pull Request workflows unless you use a specific token

  validate-xml-with-schematron:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v5 
        with:
          python-version: '3.11'
      - name: Install Schematron Validation Tool
        run: |
          # Install the specific pyschematron tool requested
          pip install pyschematron

          # Test if pyschematron is installed correctly
          if ! command -v pyschematron &> /dev/null; then
            echo "pyschematron could not be found. Please check the installation."
            exit 1
          fi

      - name: Validate XML files with Schematron
        run: |

          # 1. Create the output directory if it doesn't exist
          mkdir -p .github/workflow-reports

          # 2. Find all .xml files and write to a temporary list
          # We use 'find' to get files, then 'sort' to make the list consistent
          find . -type f -name "*.xml" | sort > /tmp/xml_files.txt

          # 3. Check if any files were found
          if [ -s /tmp/xml_files.txt ]; then
            while IFS= read -r file; do
              echo "Validating $file..."
              # Run Schematron validation
              # pyschematron returns 0 on success, non-zero on failure
              # We capture stderr to get the error message
              output=$(pyschematron -s "mei-metadata-toolkit/src/schema/mei-dc.sch" "$file" 2>&1)
              exit_code=$?  
              if [ $exit_code -eq 0 ]; then
                echo "✅ $file passed validation."
              else
                echo "❌ $file failed validation."
                echo "Error details:"
                echo "$output"
              fi
            done < /tmp/xml_files.txt
          else
            echo "No XML files to validate."
            echo "Error details:"
            echo "$output"
          fi

